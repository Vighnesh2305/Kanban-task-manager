name: Unit Tests

on:
  push:
    branches:
      - master
      - main
      - develop
    paths:
      - 'Task-manager-app/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - master
      - main
      - develop
    paths:
      - 'Task-manager-app/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task-manager-app

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npx tsc -b

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test:run

      - name: Run build
        run: npm run build
